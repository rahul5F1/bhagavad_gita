<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srimad Bhagavad Gita</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
</head>
<body class="landing-body">
    
    <canvas id="fogCanvas"></canvas>
    <div id="fogInstruction">🌫️ Rub the screen to reveal the Divine path 🌫️</div>

    <div id="warpContainer"></div> 

    <div class="overlay" id="landingOverlay">
        
        <main class="content-area">
            <div class="landing-content" id="tiltBox">
                <h1 class="main-title">Srimad Bhagavad Gita</h1>
                <p class="subtitle">The Divine Song of God</p>
                <div class="divider">🕉</div>
                
                <div class="shankh-container">
                    <svg class="progress-ring" width="120" height="120">
                       <circle class="progress-ring__circle" stroke="gold" stroke-width="4" fill="transparent" r="52" cx="60" cy="60"/>
                    </svg>
                    
                    <button id="shankhBtn" class="shankh-btn" oncontextmenu="return false;">🐚</button>
                </div>
                <p class="shankh-instruction">Hold the Shankh to Enter</p>
            </div>
        </main>

        <footer class="site-footer landing-footer">
            <div class="footer-content">
                <div class="footer-logo">🕉 Gita Wisdom</div>
                <p class="footer-text">
                    &copy; 2026 Divine Dialogue Project. All Rights Reserved.
                </p>
                <p class="footer-text">
                    Designed with <span class="footer-heart">❤</span> & Devotion by <strong><a href="https://www.linkedin.com/in/ramavath-rahul-12542926a/" target="_blank" style="color: #fdfbf7; text-decoration: underline;">Ramavath Rahul</a></strong>
                </p>
            </div>
        </footer>
    </div>

    <canvas id="sparkleCanvas"></canvas>

    <audio id="audioShankh" src="{{ url_for('static', filename='audios/shankh_rise.mp3') }}" preload="auto"></audio>
    <audio id="audioBlast" src="{{ url_for('static', filename='audios/divine_blast.mp3') }}" preload="auto"></audio>

    <script>
        /* =========================================
           AUDIO UNLOCKER & ECHO SYSTEM
           ========================================= */
        let audioUnlocked = false;
        const audioShankh = document.getElementById('audioShankh');
        const audioBlast = document.getElementById('audioBlast');
        const echoShankh = new Audio(audioShankh.src);
        echoShankh.volume = 0.4;

        function unlockAudio() {
            if (audioUnlocked) return;
            audioShankh.play().then(() => audioShankh.pause()).catch(() => {});
            echoShankh.play().then(() => echoShankh.pause()).catch(() => {});
            audioBlast.play().then(() => audioBlast.pause()).catch(() => {});
            audioUnlocked = true;
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('click', unlockAudio);
        }
        window.addEventListener('touchstart', unlockAudio, { passive: true });
        window.addEventListener('click', unlockAudio);

        function playShankhWithEcho() {
            audioShankh.currentTime = 0;
            audioShankh.volume = 1.0;
            audioShankh.play().catch(e => {});
            setTimeout(() => {
                if(!audioShankh.paused) { 
                    echoShankh.currentTime = 0;
                    echoShankh.play().catch(e => {});
                }
            }, 250);
        }

        function stopShankhWithEcho() {
            audioShankh.pause(); audioShankh.currentTime = 0;
            echoShankh.pause(); echoShankh.currentTime = 0;
        }


        /* =========================================
           1. 🌪️ 3D VOLUMETRIC FOG ENGINE
           ========================================= */
        const canvas = document.getElementById('fogCanvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('fogInstruction');
        const overlay = document.getElementById('landingOverlay');
        
        let width, height;
        let particles = [];
        let isFogCleared = false;
        
        // Mouse/Touch Tracker
        const mouse = { x: -1000, y: -1000, active: false };

        class FogParticle {
            constructor() {
                this.reset(true); // true = start randomly on screen
            }

            reset(initial = false) {
                // Random position
                this.x = initial ? Math.random() * width : -100; 
                this.y = Math.random() * height;
                
                // 3D Depth Factor (0.5 to 1.5)
                // Larger clouds = Closer = Faster = More Transparent
                this.depth = 0.5 + Math.random(); 
                
                this.radius = (100 + Math.random() * 200) * this.depth;
                this.vx = (0.2 + Math.random() * 0.5) * this.depth; // Horizontal drift
                this.vy = (Math.random() - 0.5) * 0.2; // Slight vertical wobble
                
                // Start fully opaque relative to depth
                this.opacity = (0.3 + Math.random() * 0.4) * this.depth; 
                this.maxOpacity = this.opacity;
                this.fading = false;
            }

            update() {
                // 1. Move
                this.x += this.vx;
                this.y += this.vy;

                // 2. Loop Screen
                if (this.x > width + this.radius) {
                    this.x = -this.radius;
                    this.y = Math.random() * height;
                    this.opacity = this.maxOpacity; // Reset opacity when respawning
                    this.fading = false;
                }

                // 3. Interaction (Rubbing)
                if (mouse.active && !this.fading) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    
                    // If mouse touches cloud (Radius + Brush Size)
                    if (dist < this.radius * 0.6) { 
                        this.fading = true; // Start evaporating
                    }
                }

                // 4. Fade Out Logic
                if (this.fading) {
                    this.opacity -= 0.05;
                    if (this.opacity < 0) this.opacity = 0;
                }
            }

            draw() {
                if (this.opacity <= 0.01) return;

                const g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                // Multi-stop gradient for fluffy look
                g.addColorStop(0, `rgba(240, 245, 255, ${this.opacity})`);
                g.addColorStop(0.4, `rgba(230, 240, 250, ${this.opacity * 0.6})`);
                g.addColorStop(1, `rgba(255, 255, 255, 0)`);

                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initFog() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            // Create 60 layers of clouds
            for(let i=0; i<60; i++) {
                particles.push(new FogParticle());
            }
        }

        function animateFog() {
            if (isFogCleared) return;

            ctx.clearRect(0, 0, width, height);
            
            // Check global clear condition
            let activeParticles = 0;
            
            particles.forEach(p => {
                p.update();
                p.draw();
                if (p.opacity > 0.1) activeParticles++;
            });

            // If 80% of fog is gone, clear the rest automatically
            if (activeParticles < particles.length * 0.2) {
                clearFogCompletely();
            } else {
                requestAnimationFrame(animateFog);
            }
        }

        function clearFogCompletely() {
            if(isFogCleared) return;
            isFogCleared = true;
            
            // Fade out canvas CSS
            canvas.style.transition = "opacity 2s ease"; 
            canvas.style.opacity = "0";
            
            instruction.style.transition = "opacity 1s ease"; 
            instruction.style.opacity = "0";
            
            overlay.style.opacity = "1"; 
            overlay.style.pointerEvents = "auto"; 
            
            setTimeout(() => { 
                canvas.style.display = 'none'; 
                instruction.style.display = 'none'; 
            }, 2000);
            
            // Init Warp Stars for next phase
            createWarpStars(); 
        }

        // --- EVENTS ---
        window.addEventListener('resize', initFog);
        
        // Touch/Mouse Tracking
        function trackInput(x, y) {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
            // Auto reset active after 100ms to stop clearing if not moving
            clearTimeout(mouse.timer);
            mouse.timer = setTimeout(() => mouse.active = false, 100);
        }

        window.addEventListener('mousemove', e => trackInput(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            e.preventDefault(); // Stop scroll
            trackInput(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // Start
        initFog();
        animateFog();


        /* =========================================
           2. VISHWAROOPAM (COSMIC WARP) LOGIC
           ========================================= */
        const shankhBtn = document.getElementById('shankhBtn');
        const circle = document.querySelector('.progress-ring__circle');
        const warpContainer = document.getElementById('warpContainer');
        
        const radius = circle.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        circle.style.strokeDasharray = `${circumference} ${circumference}`;
        circle.style.strokeDashoffset = circumference;

        let holdStartTime;
        let isHolding = false;
        let isTransitioning = false; 
        const holdDuration = 3000; 

        function createWarpStars() {
            for (let i = 0; i < 400; i++) {
                const star = document.createElement('div');
                star.className = 'warp-star';
                const x = (Math.random() - 0.5) * window.innerWidth * 2;
                const y = (Math.random() - 0.5) * window.innerHeight * 2;
                star.style.setProperty('--startX', `${x}px`);
                star.style.setProperty('--startY', `${y}px`);
                star.style.animationDuration = `${Math.random() * 0.5 + 0.2}s`; 
                star.style.animationDelay = `${Math.random() * 2}s`;
                warpContainer.appendChild(star);
            }
        }

        function startHold(e) {
            if (isTransitioning) return;
            if (e.type === 'touchstart') e.preventDefault(); 
            if (isHolding) return;
            
            isHolding = true;
            holdStartTime = Date.now();

            document.body.classList.add('warping');
            shankhBtn.classList.add('holding');
            
            playShankhWithEcho();

            requestAnimationFrame(updateProgress);
        }

        function updateProgress() {
            if (!isHolding || isTransitioning) return;
            
            const elapsed = Date.now() - holdStartTime;
            const progress = Math.min(elapsed / holdDuration, 1);
            const offset = circumference - (progress * circumference);
            circle.style.strokeDashoffset = offset;

            if (elapsed >= holdDuration) {
                triggerDivineEntry();
            } else {
                requestAnimationFrame(updateProgress);
            }
        }

        function endHold() {
            if (isTransitioning) return;
            if (!isHolding) return;
            isHolding = false;
            
            document.body.classList.remove('warping');
            shankhBtn.classList.remove('holding');
            circle.style.strokeDashoffset = circumference;
            
            stopShankhWithEcho();
        }

        ['mousedown', 'touchstart'].forEach(evt => shankhBtn.addEventListener(evt, startHold));
        ['mouseup', 'mouseleave', 'touchend'].forEach(evt => shankhBtn.addEventListener(evt, endHold));


        /* =========================================
           3. DIVINE ENTRY
           ========================================= */
        function triggerDivineEntry() {
            isTransitioning = true;
            isHolding = false;
            
            audioBlast.currentTime = 0;
            audioBlast.volume = 1.0;
            audioBlast.play().catch(e => {});

            document.body.classList.add('divine-flash'); 
            createSparkles(); 

            setTimeout(() => {
                window.location.href = "/chapters";
            }, 1500);
        }

        function createSparkles() {
            const sCanvas = document.getElementById('sparkleCanvas');
            const sCtx = sCanvas.getContext('2d');
            sCanvas.width = window.innerWidth;
            sCanvas.height = window.innerHeight;
            let particles = [];
            for(let i=0; i<150; i++) {
                particles.push({
                    x: window.innerWidth/2, y: window.innerHeight/2,
                    vx: (Math.random() - 0.5) * 35, vy: (Math.random() - 0.5) * 35,
                    life: 1, color: `hsl(${Math.random()*50 + 30}, 100%, 70%)`
                });
            }
            function animate() {
                sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
                particles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    sCtx.globalAlpha = p.life; sCtx.fillStyle = p.color;
                    sCtx.beginPath(); sCtx.arc(p.x, p.y, Math.random()*4, 0, Math.PI*2); sCtx.fill();
                    if(p.life <= 0) particles.splice(i, 1);
                });
                if(particles.length > 0) requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
